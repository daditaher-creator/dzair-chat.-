<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المسؤول - شات دزاير شوب</title>
    <!-- استدعاء مكتبة السحابة الفورية لعدم حدوث أي اختفاء للرسائل -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background-color: #0d1b2a; color: white; margin: 0; padding: 0; }
        .header { background-color: #ea580c; text-align: center; padding: 15px; font-size: 20px; font-weight: bold; }
        .chat-container { padding: 15px; height: 70vh; overflow-y: auto; padding-bottom: 80px; }
        .message-box { background-color: #1e293b; margin: 10px 0; padding: 12px; border-radius: 8px; display: flex; align-items: center; }
        .admin-badge { background-color: #ea580c; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; margin-left: 10px; }
        .user-badge { color: #38bdf8; font-weight: bold; margin-left: 10px; }
        .footer { position: fixed; bottom: 0; width: 100%; display: flex; background: #0f172a; padding: 12px; box-sizing: border-box; }
        input { flex: 1; padding: 14px; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 6px; margin-left: 10px; }
        button { background-color: #ea580c; border: none; color: white; padding: 14px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">👑 لوحة التحكم - القائد النبيل (المسؤول)</div>
    <div class="chat-container" id="chatContainer"></div>

    <form class="footer" id="chatForm">
        <input type="text" id="msgInput" placeholder="اكتب رسالة المسؤول الرسمية..." autocomplete="off">
        <button type="submit">بث الرسالة</button>
    </form>

    <script>
        // ربط السحابة الحية والآمنة
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibWF1eHNobHR3ZXBmYnl3eWx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDk4Mzg0MDAsImV4cCI6MjAyNTQwMTYwMH0.sampleSecretKeyForDzairChatApp2026Live";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const currentUsername = "القائد النبيل";
        const currentRole = "admin";

        const chatContainer = document.getElementById('chatContainer');
        const msgInput = document.getElementById('msgInput');
        const chatForm = document.getElementById('chatForm');

        // جلب الرسائل السحابية الحقيقية لكل الهواتف
        async function loadMessages() {
            let { data: messages, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (!error) {
                chatContainer.innerHTML = '';
                messages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message-box';
                    if (msg.role === 'admin') {
                        msgDiv.innerHTML = `<span class="admin-badge">👑 ${msg.username}:</span> <span>${msg.message}</span>`;
                    } else {
                        msgDiv.innerHTML = `<span class="user-badge">${msg.username}:</span> <span>${msg.message}</span>`;
                    }
                    chatContainer.appendChild(msgDiv);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // بث الرسالة للسحابة فوراً بدون تحديث الصفحة
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (text === '') return;

            const { error } = await supabase
                .from('messages')
                .insert([{ username: currentUsername, message: text, role: currentRole }]);

            if (!error) {
                msgInput.value = '';
                loadMessages();
            }
        });

        loadMessages();
        setInterval(loadMessages, 3000); // تحديث سحابي فوري كل 3 ثوانٍ
    </script>
</body>
</html>
